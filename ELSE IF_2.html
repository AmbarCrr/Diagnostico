<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let temperatura = parseInt(prompt("Ingrese el grado de Temperatura"));
  if (temperatura < 0) {
    console.log("Frío");
    document.write("Frio");
  } else if (temperatura >= 0 && temperatura <= 15) {
    console.log("Fresco");
    document.write("Fresco");
  } else if (temperatura >= 16 && temperatura <= 25) {
    console.log("Templado");
    document.write("Templado")
  } else {
    console.log("Caliente");
    document.write("Caliente");
  }
    </script>
</body>
</html>
