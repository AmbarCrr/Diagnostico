<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
      let nota = parseInt(prompt("Coloque El Porcentaje Y Se Le Entregara La Nota"));
  if (nota >= 90 && nota <= 100) {
    console.log("A");
    document.write("A");
  } else if (nota >= 80 && nota <= 89) {
    console.log("B");
    document.write("B");
  } else if (nota >= 70 && nota <= 79) {
    console.log("C");
    document.write("C");
  } else if (nota >= 60 && nota <= 69) {
    console.log("D");
    document.write("D");
  } else if (nota < 60 && nota >= 0) {
    console.log("F"); 
    document.write("F");
  } else {
    console.log("ERROR"); 
    Document.write("ERROR")
  }

    </script>
</body>
</html>
